<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillBridge AI</title>
<style>
:root{--ink:#eef2ff;--mute:#aab5d8;--edge:rgba(255,255,255,.2);--fill:rgba(255,255,255,.07);--brand:#3f5bf0;--brand2:#7c3aed;--ok:#4be3a3;--warn:#ffc36b;--bad:#ff938a;--acc:#9bb6ff}
*{box-sizing:border-box}[hidden]{display:none!important}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:#070a16;color:var(--ink);font:16px/1.55 "Segoe UI",Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,h4{margin:0}h2{font-size:20px;margin-bottom:10px}a{color:var(--acc)}

/* animated aurora behind the glass */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#111b44 0%,#070a16 62%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#4f46e5;top:-120px;left:-100px}
.aurora i:nth-child(2){width:460px;height:460px;background:#0891b2;top:32%;right:-140px;animation-delay:-8s}
.aurora i:nth-child(3){width:520px;height:520px;background:#c026d3;bottom:-200px;left:28%;animation-delay:-15s;opacity:.38}
@keyframes drift{to{transform:translate(70px,50px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.aurora i{animation:none}*{transition:none!important}}

/* the glass surface */
.glass,.card,.rc,header,.cp,.stat{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--edge);
 -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.card,.rc,header,.cp,.stat{background:rgba(22,28,60,.94)}}
.card{border-radius:20px;padding:20px;margin-bottom:16px}

/* form controls */
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:11px 14px;border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.07);color:var(--ink);margin:4px 0 10px;caret-color:var(--ink)}
input::placeholder,textarea::placeholder{color:#8e9bc4}
input[type=file]{padding:9px}input[type=file]::file-selector-button{margin-right:12px;border:0;border-radius:8px;padding:6px 12px;background:rgba(255,255,255,.15);color:var(--ink);cursor:pointer}
option{background:#10173a;color:var(--ink)}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 40px #1a2250 inset}
button{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.45)}
button.ghost{background:rgba(255,255,255,.08);border:1px solid var(--edge);color:var(--ink)}button.ghost:hover{background:rgba(255,255,255,.16);box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.err{color:var(--bad);min-height:22px}.mute{color:var(--mute);font-size:14px}.sm{font-size:13px}

/* header */
header{position:sticky;top:12px;z-index:20;display:flex;align-items:center;gap:16px;width:min(1120px,calc(100% - 24px));margin:12px auto 0;padding:9px 12px 9px 22px;border-radius:999px}
.logo{font-weight:800;font-size:19px;cursor:pointer;white-space:nowrap;letter-spacing:.2px}.logo b{background:linear-gradient(90deg,#9bb6ff,#e0a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:1;max-width:560px;margin:0;border-radius:999px;padding:9px 18px}
#nav{margin-left:auto;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;padding:0;font-weight:700}
.menu{position:absolute;right:14px;top:60px;background:rgba(18,24,54,.97);border:1px solid var(--edge);border-radius:14px;min-width:160px;z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.5);overflow:hidden}
.menu a{display:block;padding:11px 16px;color:var(--ink);text-decoration:none}.menu a:hover{background:rgba(255,255,255,.1)}
main{max-width:1120px;margin:0 auto;padding:24px 16px 120px}

/* hero */
.hero{text-align:center;padding:34px 0 10px}
.pill{display:inline-block;padding:6px 16px;border-radius:999px;font-size:14px;border:1px solid var(--edge);background:rgba(255,255,255,.08);color:#cfd9ff;margin-bottom:18px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.08;letter-spacing:-.02em;margin:0 auto 16px;max-width:15em;text-wrap:balance}
.grad{background:linear-gradient(90deg,#8fb0ff,#d4a5ff 55%,#7be7d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mute);max-width:38em;margin:0 auto 24px;font-size:18px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.stat{padding:10px 20px;border-radius:16px;min-width:118px}.stat b{display:block;font-size:26px;line-height:1.2}.stat span{font-size:13px;color:var(--mute)}
.up{max-width:680px;margin:0 auto;text-align:left;border-radius:26px;padding:22px}
.up .row{display:flex;gap:10px;flex-wrap:wrap}.up .row button{flex:1;min-width:150px}
.sec{font-size:22px;margin:34px 0 14px}

/* company cards */
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.rc{border-radius:20px;padding:18px;transition:transform .2s,border-color .2s}.rc:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.4)}
.rt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.co{color:#cfd9ff;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.meta span{font-size:12px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--mute)}.meta .in{color:#7be7d0;background:rgba(75,227,163,.12)}
.sc{text-align:right;font-size:22px;white-space:nowrap}
.bar{height:8px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden;width:110px;margin-left:auto}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f7cff,#b06cff);border-radius:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;border:1px solid currentColor;margin:2px;background:rgba(255,255,255,.04)}
.verified{color:var(--ok)}.claimed{color:var(--warn)}.missing{color:var(--bad)}
.rc>button{margin-top:12px}
.gap{border-top:1px solid var(--edge);padding:12px 0}

/* filters */
.filters{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--edge);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.chip small{color:var(--mute);margin-left:4px}.chip:hover{background:rgba(255,255,255,.15);box-shadow:none}
.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}.chip.on small{color:#dfe5ff}
.frow{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}.frow select{width:auto;min-width:200px;margin:0;border-radius:999px}
.more{text-align:center;margin-top:18px}

/* auth */
body.onauth header{display:none}body.onauth main{max-width:none;padding:0}
.split{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.side{padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.side h2{font-size:clamp(28px,3.6vw,42px);line-height:1.15;margin:0 0 16px;max-width:14em}
.side p{color:var(--mute);max-width:30em}.brand{font-weight:800;font-size:22px}
.steps{list-style:none;padding:0;margin:24px 0 0}.steps li{padding:10px 0 10px 18px;border-left:3px solid #7c9cff;margin-bottom:10px;color:#dbe7f8}.steps b{display:block;color:#fff}
.side svg{position:absolute;right:-40px;bottom:-10px;opacity:.3;width:420px;pointer-events:none}
.formwrap{display:flex;align-items:center;justify-content:center;padding:32px}
.form{width:100%;max-width:420px;padding:34px;border-radius:26px}.form h2{font-size:28px;margin:0 0 4px}
.form label{display:block;font-size:14px;font-weight:600;margin-top:12px}.form input{padding:13px;font-size:16px;margin:6px 0 0}
.pw{position:relative}.pw button{position:absolute;right:6px;top:10px;background:none;color:var(--acc);padding:4px 10px;font-size:14px;box-shadow:none}
.form .go{width:100%;padding:13px;margin-top:18px;font-size:16px}

/* chat widget */
#fab{position:fixed;right:22px;bottom:22px;z-index:30;border-radius:999px;padding:14px 24px;font-size:16px;box-shadow:0 10px 30px rgba(79,70,229,.55)}
.cp{position:fixed;right:22px;bottom:84px;width:410px;max-width:calc(100vw - 24px);height:min(660px,calc(100vh - 110px));z-index:30;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,rgba(32,40,88,.78),rgba(12,16,40,.82))}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--edge)}
.badge{margin-left:8px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid currentColor;color:var(--warn)}.badge.ai{color:var(--ok)}
.ico{background:rgba(255,255,255,.08);border:1px solid var(--edge);width:34px;height:34px;padding:0;border-radius:10px;margin-left:6px;font-size:15px}
.cb{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;word-wrap:break-word}
.msg.bot{background:rgba(255,255,255,.1);border:1px solid var(--edge);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:linear-gradient(135deg,var(--brand),var(--brand2));align-self:flex-end;border-bottom-right-radius:4px}
.msg p{margin:0 0 6px}.msg ul,.msg ol{margin:4px 0 6px;padding-left:20px}.msg h4{margin:6px 0 4px}.msg code{background:rgba(255,255,255,.14);padding:1px 6px;border-radius:6px}
.note{margin-top:6px;font-size:12px;color:var(--warn)}
.cq{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}.cq .chip{font-size:13px;text-align:left}
.cres{padding:0 16px 8px}.cres textarea{margin:0 0 6px}.cres input{margin:0}
.cf{display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--edge)}.cf input{margin:0;border-radius:999px}.cf .ico{margin:0;flex:none;width:40px;height:40px}.cf .send{flex:none;border-radius:999px}
.ico.has{border-color:var(--ok);color:var(--ok)}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#cfd9ff;margin-right:4px;animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}

@media(max-width:800px){.split{grid-template-columns:1fr}.side{padding:28px 24px}.side svg,.steps{display:none}}
@media(max-width:700px){.two{grid-template-columns:1fr}header{flex-wrap:wrap;border-radius:26px;padding:12px 14px}#q{order:3;max-width:none;flex-basis:100%}.cp{right:8px;left:8px;width:auto;max-width:none;bottom:76px}}
</style></head><body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header><div class="logo" id="logo" tabindex="0">Skill<b>Bridge</b> AI</div><input id="q" type="search" placeholder="Search a company, country, sector or skill (e.g. Infosys, India fintech, SQL)" aria-label="Search companies" hidden><div id="nav"></div></header>
<main id="app"></main>
<div id="chatroot"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const api=async(p,o={})=>{const r=await fetch('/api'+p,o);const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong.');return d};
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function boot(){const {user}=await api('/me');user?dash(user):authView('login')}

/* ---------- login / register ---------- */
function authView(mode){
  $('#nav').innerHTML='';$('#q').hidden=true;$('#chatroot').innerHTML='';document.body.classList.add('onauth');const reg=mode==='register';
  app.innerHTML=`<div class="split"><section class="side"><div class="brand">SkillBridge AI</div>
    <div><h2>Show what you can build, not just what you list.</h2>
    <p>Turn your resume into a skill profile, see how you match internships at companies across India and the world, and ask the AI assistant what to learn next.</p>
    <ul class="steps"><li><b>Upload your resume</b>We find the skills you already have.</li>
    <li><b>Pick a target company</b>See exactly which skills are missing.</li>
    <li><b>Build and submit a project</b>Verified skills turn green on your profile.</li></ul></div>
    <svg viewBox="0 0 420 200" fill="none" stroke="#9bb6ff" stroke-width="3"><path d="M0 170 H420"/><path d="M30 170 Q120 20 210 170 Q300 20 390 170"/><path d="M75 170 V95 M120 170 V60 M165 170 V95 M255 170 V95 M300 170 V60 M345 170 V95"/></svg>
    <div class="mute">Prototype for student career development</div></section>
  <section class="formwrap"><form class="form glass" id="f" novalidate>
    <h2>${reg?'Create your account':'Welcome back'}</h2>
    <p class="mute">${reg?'Start building your evidence-based skill profile.':'Log in to continue your career pathway.'}</p>
    ${reg?'<label for="n">Full name</label><input id="n" autocomplete="name">':''}
    <label for="e">Email</label><input id="e" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'At least 8 characters':'Your password'}"><button type="button" id="sh">Show</button></div>
    <div class="err" id="err" role="alert"></div>
    <button class="go" type="submit">${reg?'Create account':'Log in'}</button>
    <p class="mute">${reg?'Already registered?':'New here?'} <a href="#" id="sw">${reg?'Log in':'Create an account'}</a></p></form></section></div>`;
  $('#sw').onclick=e=>{e.preventDefault();authView(reg?'login':'register')};
  $('#sh').onclick=()=>{const p=$('#p'),h=p.type==='password';p.type=h?'text':'password';$('#sh').textContent=h?'Hide':'Show'};
  $('#f').onsubmit=async e=>{e.preventDefault();try{await post(reg?'/register':'/login',{name:reg?$('#n').value:'',email:$('#e').value,password:$('#p').value});boot()}catch(x){$('#err').textContent=x.message}};
  $('#e').focus();
}

/* ---------- shared pieces ---------- */
let ME=null,scored=false,timer,META=null;
const F={q:'',sector:'',country:'',n:12};
const getMeta=async()=>META||(META=await api('/meta'));
const initials=n=>n.split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
const chips=sk=>sk.slice().sort((a,b)=>b.weight-a.weight).map(s=>`<span class="tag ${s.status}" title="${s.weight===3?'Core skill':'Supporting skill'}">${s.weight===3?'★ ':''}${esc(s.skill)}</span>`).join('');
const card=r=>{const miss=r.skills.filter(s=>s.status==='missing'&&s.weight===3).map(s=>esc(s.skill));
  return `<div class="rc"><div class="rt"><div><b>${esc(r.title)}</b><div class="co">${esc(r.company)}</div>
  <div class="meta"><span>${esc(r.country)}</span><span>${esc(r.sector)}</span>${r.india&&r.country!=='India'?'<span class="in">India offices</span>':''}</div></div>
  <div class="sc"><b>${scored?r.score+'%':'–'}</b><div class="bar"><i style="width:${scored?r.score:0}%"></i></div></div></div>
  <div class="mute sm">Skills needed (★ = core skill)</div><div>${chips(r.skills)}</div>
  ${scored&&miss.length?`<div class="mute" style="margin-top:6px">Learn these first: <b>${miss.join(', ')}</b></div>`:''}
  <button class="ghost" data-id="${r.id}">View skill gap and projects</button></div>`};
const bind=(el,back)=>el.querySelectorAll('.rc button').forEach(b=>b.onclick=()=>detail(b.dataset.id,back));

/* company explorer: sector chips + country select + paging, used on home and on search */
async function renderExplore(el,back,step=12){
  const meta=await getMeta();
  const p=new URLSearchParams({q:F.q,sector:F.sector,country:F.country,limit:F.n});
  const {roles,total}=await api('/roles?'+p);
  el.innerHTML=`<div class="filters"><div class="chips" role="group" aria-label="Filter by sector">
    <button class="chip ${F.sector?'':'on'}" data-s="">All sectors</button>${meta.sectors.map(s=>`<button class="chip ${F.sector===s.name?'on':''}" data-s="${esc(s.name)}">${esc(s.name)} <small>${s.count}</small></button>`).join('')}</div>
    <div class="frow"><label class="mute" for="fc">Country</label><select id="fc"><option value="">All countries</option>${meta.countries.map(c=>`<option value="${esc(c.name)}" ${F.country===c.name?'selected':''}>${esc(c.name)} (${c.count})</option>`).join('')}</select>
    <span class="mute">${total} role${total===1?'':'s'}${F.country==='India'?' (includes global companies with India offices)':''}</span></div></div>
   ${roles.length?`<div class="two">${roles.map(card).join('')}</div>`:'<p class="mute">No matches. Try a company (Infosys), a country (Singapore), a sector (fintech) or a skill (SQL).</p>'}
   ${roles.length<total?`<div class="more"><button class="ghost" id="more">Show more (${total-roles.length} left)</button></div>`:''}`;
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{F.sector=b.dataset.s;F.n=step;renderExplore(el,back,step)});
  el.querySelector('#fc').onchange=e=>{F.country=e.target.value;F.n=step;renderExplore(el,back,step)};
  const m=el.querySelector('#more');if(m)m.onclick=()=>{F.n+=step;renderExplore(el,back,step)};
  bind(el,back);
}

/* ---------- main views ---------- */
async function dash(user){
  ME=user;document.body.classList.remove('onauth');$('#q').hidden=false;
  $('#nav').innerHTML=`<button class="avatar" id="av" aria-label="Open profile menu">${esc(initials(user.name))}</button>
   <div class="menu" id="mn" hidden><a href="#" id="mp">My profile</a><a href="#" id="ml">Log out</a></div>`;
  $('#av').onclick=()=>{$('#mn').hidden=!$('#mn').hidden};
  $('#mp').onclick=e=>{e.preventDefault();$('#mn').hidden=true;profile()};
  $('#ml').onclick=async e=>{e.preventDefault();await post('/logout',{});authView('login')};
  $('#logo').onclick=home;
  $('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(search,300)};
  chatMount();home();
}

async function home(){
  $('#q').value='';Object.assign(F,{q:'',sector:'',country:'',n:12});
  const [{skills},meta]=await Promise.all([api('/skills'),getMeta()]);scored=skills.length>0;
  const stat=(n,l)=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  app.innerHTML=`<section class="hero"><span class="pill">✦ AI-powered internship readiness</span>
   <h1>Find the internship that fits <span class="grad">your skills</span></h1>
   <p class="lead">Paste your resume and see how you match companies in India and around the world, from TCS and Infosys to Google, Grab and Siemens. Then ask the AI what to learn next.</p>
   <div class="stats">${stat(meta.companies,'companies')}${stat(meta.countries.length,'countries')}${stat(meta.sectors.length,'sectors')}${stat(meta.roles,'role profiles')}</div>
   <div class="glass up"><textarea id="rt" rows="5" placeholder="Paste your resume or project descriptions here"></textarea>
   <input id="rf" type="file" accept=".pdf,.txt" aria-label="Upload resume"><div class="err" id="re" role="alert"></div>
   <div class="row"><button id="ru">Find my matches</button><button class="ghost" id="ai">✦ Ask the AI assistant</button></div></div></section>
   <div id="res"></div><h2 class="sec">Explore companies</h2><div id="explore"></div>`;
  $('#ru').onclick=async()=>{const fd=new FormData();fd.append('text',$('#rt').value);if($('#rf').files[0])fd.append('file',$('#rf').files[0]);
    $('#re').textContent='';try{await api('/resume',{method:'POST',body:fd});await showMatches();await renderExplore($('#explore'),home);$('#res').scrollIntoView({behavior:'smooth'})}catch(e){$('#re').textContent=e.message}};
  $('#ai').onclick=()=>openChat();
  if(scored)await showMatches();
  await renderExplore($('#explore'),home);
}

async function showMatches(){
  const [{skills},{roles}]=await Promise.all([api('/skills'),api('/roles?limit=6')]);scored=true;
  $('#res').innerHTML=`<h2 class="sec">Skills we found</h2><div>${skills.map(s=>`<span class="tag ${s.status}" title="${esc(s.evidence)}">${esc(s.skill)}</span>`).join('')}</div>
   <h2 class="sec">Your best matches</h2><div class="two">${roles.map(card).join('')}</div>`;
  bind($('#res'),home);
}

async function search(){
  F.q=$('#q').value.trim();if(!F.q)return home();F.n=24;
  app.innerHTML=`<h2 class="sec" style="margin-top:8px">Results for “${esc(F.q)}”</h2>
   ${scored?'':'<p class="mute">Add your resume on the home page to see your match percentage.</p>'}<div id="explore"></div>`;
  await renderExplore($('#explore'),search,24);
}

async function detail(id,back){
  const g=await api('/gap/'+id);
  app.innerHTML=`<button class="ghost" id="bk">← Back</button><div class="card" style="margin-top:12px"><h2>${esc(g.title)} at ${esc(g.company)}: ${g.score}% match</h2>
  <div class="meta" style="margin-bottom:10px"><span>${esc(g.country)}</span><span>${esc(g.sector)}</span></div>
  <p class="mute">Core skills (★) matter most for getting this internship.</p>
  <button id="askco" style="margin-bottom:8px">✦ Ask AI: can I get this internship?</button>
  ${g.skills.sort((a,b)=>b.weight-a.weight).map(s=>`<div class="gap"><b>${s.weight===3?'★ ':''}${esc(s.skill)}</b> <span class="tag ${s.status}">${s.status}</span>
   ${s.evidence?`<div class="mute">Evidence: ${esc(s.evidence)}</div>`:''}
   ${s.status!=='verified'?`<div class="mute">Suggested project: ${esc(s.project)}</div>
   <input placeholder="https://github.com/you/your-repo" data-sk="${esc(s.skill)}" aria-label="GitHub repo for ${esc(s.skill)}">
   <button class="ghost" data-sub="${esc(s.skill)}">Submit as evidence</button><div class="mute" data-out="${esc(s.skill)}"></div>`:''}</div>`).join('')}</div>`;
  $('#bk').onclick=()=>back();
  $('#askco').onclick=()=>openChat(`Can I get the ${g.title} internship at ${g.company}? What should I improve?`);
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=async()=>{
    const sk=b.dataset.sub,out=document.querySelector(`[data-out="${sk}"]`);out.textContent='Checking repo…';
    try{const r=await post('/submit',{skill:sk,url:document.querySelector(`input[data-sk="${sk}"]`).value});
      out.innerHTML=`Score ${r.score}/100: ${r.verified?'verified!':'not verified yet.'}<br>${r.feedback.map(esc).join('<br>')}`;
      if(r.verified)setTimeout(()=>detail(id,back),1500)}catch(e){out.textContent=e.message}});
  window.scrollTo(0,0);
}

async function profile(){
  const [p,{skills}]=await Promise.all([api('/profile'),api('/skills')]);
  const ver=skills.filter(s=>s.status==='verified').length;
  const f=(id,label,ph='',t='text')=>`<label for="${id}">${label}</label><input id="${id}" type="${t}" value="${esc(p[id]||'')}" placeholder="${ph}">`;
  app.innerHTML=`<div class="card" style="max-width:640px;margin:0 auto"><div style="display:flex;gap:16px;align-items:center;margin-bottom:12px">
   <div class="avatar" style="width:64px;height:64px;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2))">${esc(initials(p.name))}</div>
   <div><h2 style="margin:0">${esc(p.name)}</h2><div class="mute">${esc(p.email)} · ${skills.length} skills, ${ver} verified</div></div></div>
   ${f('name','Full name')}${f('college','College or university','e.g. Anna University')}${f('degree','Degree and major','e.g. B.Tech Computer Science')}
   ${f('year','Year of study or graduation','e.g. Year 3, graduating 2027')}${f('linkedin','LinkedIn link','https://www.linkedin.com/in/your-name')}${f('github','GitHub link','https://github.com/your-name')}
   <label for="bio">About you</label><textarea id="bio" rows="3" placeholder="Interests and the kind of internship you want">${esc(p.bio||'')}</textarea>
   <div class="err" id="pe" role="alert"></div><button id="sv">Save profile</button> <button class="ghost" id="bk">Back to home</button></div>`;
  $('#bk').onclick=home;
  $('#sv').onclick=async()=>{const b={};['name','college','degree','year','linkedin','github','bio'].forEach(k=>b[k]=$('#'+k).value);
    try{await post('/profile',b);ME.name=b.name||ME.name;$('#av').textContent=initials(ME.name);$('#pe').style.color='var(--ok)';$('#pe').textContent='Profile saved.'}
    catch(e){$('#pe').style.color='var(--bad)';$('#pe').textContent=e.message}};
}

/* ---------- AI chat widget ---------- */
const CH={hist:[],busy:false};
const QUICK=['What skills does Google look for?','Can I get an internship at TCS with my resume?','Skills for a data analyst role in India','Best fintech companies for my skills'];
function md(src){  // tiny safe markdown: escape first, then **bold**, lists, headings
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
  let out='',list=null;const close=()=>{if(list){out+='</'+list+'>';list=null}};
  for(const raw of String(src).split('\n')){const l=raw.trimEnd();let m;
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>'}
    else if(m=l.match(/^#{1,4}\s+(.*)/)){close();out+='<h4>'+inl(m[1])+'</h4>'}
    else if(!l.trim())close();else{close();out+='<p>'+inl(l)+'</p>'}}
  close();return out}
function addMsg(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;$('#cb').appendChild(d);$('#cb').scrollTop=1e9;return d}
function setMode(m){const b=$('#mode');b.textContent=m==='ai'?'AI mode':'Offline mode';b.className='badge'+(m==='ai'?' ai':'');b.title=m==='ai'?'Answers written by Claude':'Built-in answers. Add an API key for AI mode.'}
function chatMount(){
  $('#chatroot').innerHTML=`<button id="fab" aria-label="Open AI assistant">✦ Ask AI</button>
  <section class="cp" id="cp" hidden aria-label="AI career assistant">
   <div class="ch"><div><b>SkillBridge AI</b><span class="badge" id="mode">…</span></div><div><button class="ico" id="cclr" title="New chat" aria-label="New chat">↺</button><button class="ico" id="cx" aria-label="Close chat">✕</button></div></div>
   <div class="cb" id="cb" aria-live="polite"></div><div class="cq" id="cq"></div>
   <div class="cres" id="cres" hidden><textarea id="crt" rows="4" placeholder="Paste your resume text here (kept only in this chat box)"></textarea><input id="crf" type="file" accept=".pdf,.txt" aria-label="Upload resume file"></div>
   <form class="cf" id="cf"><button type="button" class="ico" id="crb" title="Add your resume" aria-label="Add your resume">📎</button>
    <input id="ci" placeholder="Ask about a company, role or your chances…" maxlength="2000" autocomplete="off" aria-label="Message"><button class="send" type="submit">Send</button></form></section>`;
  api('/chat/status').then(s=>setMode(s.ai?'ai':'offline')).catch(()=>setMode('offline'));
  $('#fab').onclick=()=>openChat();$('#cx').onclick=()=>{$('#cp').hidden=true;$('#fab').hidden=false};
  $('#cclr').onclick=()=>{CH.hist=[];chatReset()};
  $('#crb').onclick=()=>{$('#cres').hidden=!$('#cres').hidden;if(!$('#cres').hidden)$('#crt').focus()};
  const mark=()=>$('#crb').classList.toggle('has',!!($('#crt').value.trim()||$('#crf').files[0]));
  $('#crt').oninput=mark;$('#crf').onchange=mark;
  $('#cf').onsubmit=e=>{e.preventDefault();send($('#ci').value)};
  chatReset();
}
function chatReset(){
  $('#cb').innerHTML='';
  addMsg('bot',md("Hi! I'm your career assistant. Tap the paperclip to add your resume, then ask me things like **\"Can I get an internship at Infosys?\"** or **\"What skills does Google look for?\"**"));
  $('#cq').hidden=false;$('#cq').innerHTML=QUICK.map(q=>`<button type="button" class="chip">${esc(q)}</button>`).join('');
  $('#cq').querySelectorAll('.chip').forEach(b=>b.onclick=()=>send(b.textContent));
}
function openChat(prefill){$('#cp').hidden=false;$('#fab').hidden=true;$('#ci').focus();if(prefill)send(prefill)}
async function send(text){
  text=(text||'').trim();if(!text||CH.busy)return;CH.busy=true;
  addMsg('user',esc(text));$('#ci').value='';$('#cq').hidden=true;
  const t=addMsg('bot','<span class="dots" aria-label="Thinking"><i></i><i></i><i></i></span>');
  const fd=new FormData();fd.append('message',text);fd.append('history',JSON.stringify(CH.hist));fd.append('resume',$('#crt').value);
  const f=$('#crf').files[0];if(f)fd.append('file',f);
  try{const r=await api('/chat',{method:'POST',body:fd});
    t.innerHTML=md(r.reply)+(r.note?`<div class="note">${esc(r.note)}</div>`:'');setMode(r.mode);
    CH.hist.push({role:'user',content:text},{role:'assistant',content:r.reply});CH.hist=CH.hist.slice(-8)}
  catch(e){t.textContent=e.message}
  CH.busy=false;$('#cb').scrollTop=Math.max(0,t.offsetTop-10);  // show the start of the answer, not the end
}

boot();
</script></body></html>
